project_id = "project-parts-keeper"

[api]
enabled = true
port = 54341
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54342
shadow_port = 54340
major_version = 15

[studio]
enabled = true
port = 54343
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54344

[analytics]
enabled = true
port = 54347

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3003"
additional_redirect_urls = ["http://localhost:3003/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
